name: VacuumTube Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vacuumtube-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Windows Intel/AMD x64 NSIS setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Uses the project's original electron-builder NSIS settings:
      # interactive wizard, configurable installation directory and uninstaller.
      # Explicit target and architecture prevent ZIP, ARM, macOS or Linux builds.
      - name: Package Windows x64 installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }

      - name: Verify installer and update metadata
        shell: pwsh
        run: |
          $setup = 'dist/VacuumTube-Setup.exe'
          if (!(Test-Path $setup)) { throw "Missing installer: $setup" }
          if ((Get-Item $setup).Length -lt 1MB) { throw "Installer is unexpectedly small" }
          if (!(Test-Path 'dist/latest.yml')) { throw 'Missing Windows updater metadata' }
          if (!(Test-Path 'dist/VacuumTube-Setup.exe.blockmap')) { throw 'Missing Windows blockmap' }
          $unexpected = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in @('.dmg','.deb','.AppImage','.zip') })
          if ($unexpected.Count) { throw "Unexpected packages: $($unexpected.Name -join ', ')" }

      - name: Publish downloadable Windows installer release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "vacuumtube-dev-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create $tag dist/VacuumTube-Setup.exe dist/VacuumTube-Setup.exe.blockmap dist/latest.yml --target "${{ github.sha }}" --title "VacuumTube Windows test installer ${{ github.run_number }}.${{ github.run_attempt }}" --notes "Windows x64 installer (Intel/AMD) built from commit ${{ github.sha }}. Uses the standard VacuumTube NSIS installer wizard. Download VacuumTube-Setup.exe. Unsigned development build." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed" }

      - name: Keep the newest two development releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const builds = releases.filter(r => r.tag_name.startsWith('vacuumtube-dev-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            for (const old of builds.slice(2)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: old.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: 'tags/' + old.tag_name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
