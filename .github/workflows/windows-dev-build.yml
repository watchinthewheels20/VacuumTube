name: VacuumTube Windows development build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
      - name: Build Windows x64 installer and portable ZIP
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          if (!(Test-Path 'dist/VacuumTube-Setup.exe')) { throw "Installer missing" }
          if (!(Test-Path 'dist/VacuumTube-x64-Portable.zip')) { throw "Portable ZIP missing" }
      - name: Publish development release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vacuumtube-dev-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create $tag dist/VacuumTube-Setup.exe dist/VacuumTube-x64-Portable.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "VacuumTube development build ${{ github.run_number }}" --notes "Windows x64 test build from commit ${{ github.sha }}." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
      - name: Keep newest two development releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner,repo,per_page:100});
            const builds = releases.filter(r => r.tag_name.startsWith('vacuumtube-dev-')).sort((a,b) => new Date(b.created_at)-new Date(a.created_at));
            for (const old of builds.slice(2)) {
              await github.rest.repos.deleteRelease({owner,repo,release_id:old.id});
              try { await github.rest.git.deleteRef({owner,repo,ref:'tags/'+old.tag_name}); }
              catch(e) { if(e.status!==404) throw e; }
            }
